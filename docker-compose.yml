name: camper-ha
services:
  homeassistant:
    image: ${HA_IMAGE:?Copy .env.example to .env and select a pinned HA_IMAGE}
    platform: linux/arm64
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${TZ:-Australia/Brisbane}
    volumes:
      - /opt/camper-ha/config:/config
      - /run/dbus:/run/dbus:ro
      - /run/camper-ha:/host-status:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/manifest.json', timeout=10)"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
